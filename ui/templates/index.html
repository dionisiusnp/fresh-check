<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCheck — Stale-Claim Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    mark { background: none; }

    .fc-confirmed {
      border-bottom: 2px solid #16a34a;
      position: relative;
      cursor: help;
    }
    .fc-contradicted {
      border-bottom: 2px solid #dc2626;
      position: relative;
      cursor: help;
    }
    .fc-unverifiable {
      border-bottom: 2px dashed #ca8a04;
      position: relative;
      cursor: help;
    }

    .fc-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 3px;
      vertical-align: super;
      white-space: nowrap;
    }
    .fc-confirmed   .fc-badge { background: #dcfce7; color: #15803d; }
    .fc-contradicted .fc-badge { background: #fee2e2; color: #b91c1c; }
    .fc-unverifiable .fc-badge { background: #fef9c3; color: #a16207; }

    .fc-source-link {
      font-size: 10px;
      color: #2563eb;
      text-decoration: underline;
      margin-left: 2px;
    }

    .claim-card { transition: box-shadow 0.15s; }
    .claim-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl font-bold tracking-tight text-gray-900">FreshCheck</span>
      <span class="text-sm text-gray-500">Stale-Claim Detector</span>
    </div>
    <span id="mode-badge" class="text-xs font-semibold px-3 py-1 rounded-full
      {{ 'bg-amber-100 text-amber-700' if mode == 'demo' else 'bg-green-100 text-green-700' }}">
      {{ mode | upper }}
    </span>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">

    <!-- Demo fixture selector (demo mode only) -->
    {% if mode == 'demo' %}
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
      <p class="text-sm font-medium text-amber-800 mb-2">Demo mode — select a preset or paste your own answer below.</p>
      <select id="fixture-select" onchange="loadFixture(this.value)"
        class="w-full text-sm border border-amber-300 rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-amber-400">
        <option value="">— Choose a demo preset —</option>
        {% for f in fixtures %}
        <option value="{{ f.llm_answer | e }}">{{ f.label }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <!-- Input -->
    <div class="bg-white rounded-lg border border-gray-200 p-5 space-y-3">
      <label class="block text-sm font-semibold text-gray-700">Paste an LLM answer to check</label>
      <textarea id="answer-input" rows="6" placeholder="e.g. GPT-4 Turbo costs $0.01 per 1K input tokens…"
        class="w-full text-sm border border-gray-300 rounded-md px-3 py-2 resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"></textarea>
      <button onclick="runCheck()"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-md transition-colors disabled:opacity-50"
        id="check-btn">
        Check Freshness
      </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-8 text-gray-500 text-sm">
      <svg class="animate-spin inline w-5 h-5 mr-2 text-blue-500" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      Checking claims…
    </div>

    <!-- Error -->
    <div id="error-box" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-700"></div>

    <!-- Results -->
    <div id="results" class="hidden space-y-5">

      <!-- Summary bar -->
      <div id="summary-bar" class="bg-white border border-gray-200 rounded-lg p-4 flex flex-wrap gap-4 items-center">
        <span class="text-sm font-semibold text-gray-700">Summary:</span>
        <span class="text-sm"><span class="inline-block w-3 h-3 rounded-full bg-green-500 mr-1"></span><span id="s-confirmed">0</span> confirmed</span>
        <span class="text-sm"><span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-1"></span><span id="s-contradicted">0</span> contradicted</span>
        <span class="text-sm"><span class="inline-block w-3 h-3 rounded-full bg-yellow-400 mr-1"></span><span id="s-unverifiable">0</span> unverifiable</span>
        <span class="text-xs text-gray-400 ml-auto" id="s-duration"></span>
      </div>

      <!-- Annotated answer -->
      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Annotated Answer</p>
        <div id="annotated" class="text-sm text-gray-800 leading-relaxed"></div>
      </div>

      <!-- Per-claim detail -->
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Claims Detail</p>
        <div id="claims-list" class="space-y-3"></div>
        <p id="no-claims-msg" class="hidden text-sm text-gray-500 italic">No verifiable claims found.</p>
      </div>
    </div>

  </main>

  <script>
    function loadFixture(val) {
      if (val) document.getElementById('answer-input').value = val;
    }

    async function runCheck() {
      const answer = document.getElementById('answer-input').value.trim();
      if (!answer) return;

      setLoading(true);
      hideResults();
      hideError();

      try {
        const res = await fetch('/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ llm_answer: answer }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          showError(data.error || 'Unknown error');
        } else {
          renderResults(data);
        }
      } catch (e) {
        showError('Network error: ' + e.message);
      } finally {
        setLoading(false);
      }
    }

    function renderResults(data) {
      document.getElementById('s-confirmed').textContent = data.summary.confirmed;
      document.getElementById('s-contradicted').textContent = data.summary.contradicted;
      document.getElementById('s-unverifiable').textContent = data.summary.unverifiable;
      document.getElementById('s-duration').textContent = `${data.duration_ms}ms`;

      document.getElementById('annotated').innerHTML = data.annotated_answer;

      const list = document.getElementById('claims-list');
      const noMsg = document.getElementById('no-claims-msg');
      list.innerHTML = '';

      if (data.claims.length === 0) {
        noMsg.classList.remove('hidden');
      } else {
        noMsg.classList.add('hidden');
        data.claims.forEach(c => list.appendChild(buildClaimCard(c)));
      }

      document.getElementById('results').classList.remove('hidden');
    }

    function buildClaimCard(c) {
      const COLOR = {
        confirmed_current: { border: 'border-green-200', bg: 'bg-green-50', badge: 'bg-green-100 text-green-700', icon: '✓' },
        contradicted:      { border: 'border-red-200',   bg: 'bg-red-50',   badge: 'bg-red-100 text-red-700',   icon: '✗' },
        unverifiable:      { border: 'border-yellow-200', bg: 'bg-yellow-50', badge: 'bg-yellow-100 text-yellow-700', icon: '?' },
      };
      const style = COLOR[c.status] || COLOR.unverifiable;

      const card = document.createElement('div');
      card.className = `claim-card border ${style.border} ${style.bg} rounded-lg p-4 space-y-1`;

      const header = document.createElement('div');
      header.className = 'flex items-start gap-2';
      header.innerHTML = `
        <span class="text-xs font-semibold px-2 py-0.5 rounded ${style.badge} shrink-0 mt-0.5">${style.icon} ${c.status.replace(/_/g, ' ')}</span>
        <span class="text-sm font-medium text-gray-800">${esc(c.claim)}</span>
      `;
      card.appendChild(header);

      const meta = document.createElement('div');
      meta.className = 'flex gap-3 text-xs text-gray-500 pl-1';
      meta.innerHTML = `<span>Category: <strong>${esc(c.category)}</strong></span><span>Subject: <strong>${esc(c.subject)}</strong></span>`;
      card.appendChild(meta);

      if (c.reasoning) {
        const reason = document.createElement('p');
        reason.className = 'text-xs text-gray-600 pl-1';
        reason.textContent = c.reasoning;
        card.appendChild(reason);
      }

      if (c.contradicting_evidence) {
        const ev = document.createElement('blockquote');
        ev.className = 'text-xs border-l-2 border-red-400 pl-3 text-red-700 italic';
        ev.textContent = c.contradicting_evidence;
        card.appendChild(ev);
      }

      if (c.source_url) {
        const link = document.createElement('a');
        link.href = c.source_url;
        link.target = '_blank';
        link.className = 'text-xs text-blue-600 hover:underline pl-1';
        link.textContent = `↗ Source${c.source_date ? ` (${c.source_date})` : ''}`;
        card.appendChild(link);
      }

      return card;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function setLoading(on) {
      document.getElementById('loading').classList.toggle('hidden', !on);
      document.getElementById('check-btn').disabled = on;
    }
    function hideResults() { document.getElementById('results').classList.add('hidden'); }
    function hideError()   { document.getElementById('error-box').classList.add('hidden'); }
    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runCheck();
    });
  </script>
</body>
</html>
